# ==============================================================================
# Yazi Configuration (Terminal File Manager)
# ==============================================================================
# Opens selected files directly in Neovim for editing, with automatic fallback
# to $EDITOR or nano if Neovim is not installed.

[opener]
edit = [
	{ run = 'sh -c "command -v nvim >/dev/null 2>&1 && exec nvim \"\$@\" || exec \${EDITOR:-nano} \"\$@\"" -- %s', block = true, desc = "Neovim / Editor", for = "unix" },
]
