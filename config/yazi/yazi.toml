# ==============================================================================
# Yazi Configuration (Terminal File Manager)
# ==============================================================================
# Opens files in Neovim (nvim) by default, with automatic fallback to $EDITOR or nano.

[opener]
edit = [
	{ run = 'if command -v nvim >/dev/null 2>&1; then nvim "$@"; elif [ -n "$EDITOR" ]; then "$EDITOR" "$@"; else nano "$@"; fi', block = true, desc = "Editor (Neovim / Fallback)", for = "unix" },
]
